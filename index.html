<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Junior Astronaut Mission Trainer - run a Mars outpost for 7 days." />
    <title>Junior Astronaut Mission Trainer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: url('/assets/cursor.png'), default !important;
      }
      #game,
      canvas {
        width: 100%;
        height: 100%;
        cursor: url('/assets/cursor.png'), default !important;
      }
      button,
      [role='button'],
      .interactive {
        cursor: url('/assets/cursor-hover.png'), pointer !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="error-banner" style="display:none;position:fixed;top:10px;left:10px;right:10px;background:#c92a2a;color:#fff;padding:14px;font-family:monospace;font-size:14px;z-index:99999;border-radius:6px;border:1px solid #ff8787;"></div>
    <script>
      window.addEventListener('error', function (e) {
        var b = document.getElementById('error-banner');
        if (b) {
          b.style.display = 'block';
          b.innerText = 'Launch error: ' + (e.message || e);
        }
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
